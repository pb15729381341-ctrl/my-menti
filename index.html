<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Mentimeter Clone - 玩家端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-tap:active { transform: scale(0.95); opacity: 0.8; }
        .opt-btn { transition: all 0.15s ease; }
        .opt-btn:hover { filter: brightness(1.15); transform: scale(1.02); }
    </style>
</head>
<body class="bg-indigo-950 text-white min-h-screen flex flex-col">

    <!-- 登录界面 -->
    <div id="view-login" class="flex-grow flex flex-col items-center justify-center p-6">
        <h1 class="text-4xl font-bold mb-8 text-indigo-400">加入游戏</h1>
        <div class="w-full max-w-xs space-y-4">
            <input type="text" id="nickname" placeholder="输入你的昵称" class="w-full p-4 rounded-xl bg-gray-800 border-2 border-indigo-500 text-white text-center text-xl focus:outline-none focus:border-indigo-400">
            <button onclick="joinGame()" id="btn-join" class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-xl font-bold text-xl shadow-lg transition">
                进入大厅
            </button>
        </div>
    </div>

    <!-- 等待室 -->
    <div id="view-waiting" class="hidden flex-grow flex flex-col items-center justify-center p-6 text-center">
        <div class="animate-bounce mb-4 text-6xl">🎮</div>
        <h2 class="text-3xl font-bold mb-2">已成功加入！</h2>
        <p class="text-gray-400 text-xl" id="display-nickname"></p>
        <div class="mt-8 space-y-3">
            <p class="text-indigo-300 animate-pulse text-lg">等待主持人开始游戏...</p>
            <div id="ws-status" class="text-sm text-green-400">● 已连接</div>
        </div>
    </div>

    <!-- 答题界面 -->
    <div id="view-question" class="hidden flex-grow flex flex-col p-4">
        <!-- 题号和进度 -->
        <div class="text-center mb-2">
            <span class="text-indigo-300 text-sm" id="q-progress"></span>
        </div>

        <!-- 倒计时条 -->
        <div class="h-2 bg-indigo-800 rounded-full mb-4 overflow-hidden">
            <div id="timer-bar" class="h-full bg-yellow-400 transition-all duration-1000 linear" style="width: 100%"></div>
        </div>

        <!-- 题目文字 -->
        <div class="mb-6">
            <h2 id="question-text" class="text-2xl md:text-3xl font-bold leading-relaxed text-white"></h2>
        </div>

        <!-- 四个选项（带颜色+文字） -->
        <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-4" id="options-container">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 答题后等待 -->
    <div id="view-answered" class="hidden flex-grow flex flex-col items-center justify-center p-6 text-center">
        <div class="text-6xl mb-4">✅</div>
        <h2 class="text-2xl font-bold">答案已提交！</h2>
        <p class="mt-4 text-gray-400">等待其他玩家或倒计时结束...</p>
    </div>

    <!-- 单题结果 -->
    <div id="view-result" class="hidden flex-grow flex flex-col items-center justify-center p-6 text-center">
        <div id="result-icon" class="text-8xl mb-4"></div>
        <h2 id="result-text" class="text-4xl font-bold mb-2"></h2>
        <p id="result-score" class="text-2xl text-yellow-400 font-mono"></p>
        <p class="mt-8 text-gray-500">准备下一题...</p>
    </div>

    <!-- 游戏结束 -->
    <div id="view-finished" class="hidden flex-grow flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-5xl font-black text-indigo-400 mb-4">游戏结束</h1>
        <div id="final-rank" class="text-2xl space-y-2"></div>
        <button onclick="location.reload()" class="mt-12 bg-gray-800 px-8 py-3 rounded-full text-gray-400 hover:bg-gray-700 transition">退出游戏</button>
    </div>

    <script>
        let ws = null;
        let myNickname = '';
        let currentTimeout = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT = 5;

        // 选项颜色配置（Mentimeter 风格）
        const OPTION_COLORS = {
            A: { bg: 'bg-red-500', hover: 'hover:bg-red-400', ring: 'ring-red-300' },
            B: { bg: 'bg-blue-500', hover: 'hover:bg-blue-400', ring: 'ring-blue-300' },
            C: { bg: 'bg-yellow-500', hover: 'hover:bg-yellow-400', ring: 'ring-yellow-300', dark: true },
            D: { bg: 'bg-green-500', hover: 'hover:bg-green-400', ring: 'ring-green-300' }
        };

        function showView(id) {
            ['view-login', 'view-waiting', 'view-question', 'view-answered', 'view-result', 'view-finished'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        function connectWS(nickname) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/player/${encodeURIComponent(nickname)}`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                reconnectAttempts = 0;
                showView('view-waiting');
                document.getElementById('display-nickname').innerText = `你好，${nickname}`;
                updateStatus('connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Message parse error:', e, event.data);
                }
            };

            ws.onclose = (event) => {
                console.log('WebSocket closed:', event.code, event.reason);
                updateStatus('disconnected');

                // 自动重连（最多尝试5次）
                if (reconnectAttempts < MAX_RECONNECT && document.getElementById('view-waiting').classList.contains('hidden') === false) {
                    reconnectAttempts++;
                    updateStatus(`reconnecting (${reconnectAttempts}/${MAX_RECONNECT})`);
                    setTimeout(() => connectWS(myNickname), 2000 * reconnectAttempts);
                } else if (reconnectAttempts >= MAX_RECONNECT) {
                    // 超过重试次数，提示用户
                    alert('连接已断开，无法自动恢复。请刷新页面重新加入。');
                    location.reload();
                } else {
                    // 不在等待室时断开，直接提示
                    alert('连接已断开');
                    location.reload();
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function updateStatus(state) {
            const el = document.getElementById('ws-status');
            if (!el) return;
            switch(state) {
                case 'connected': el.innerHTML = '<span class="text-green-400">● 已连接</span>'; break;
                case 'disconnected': el.innerHTML = '<span class="text-red-400">● 已断开</span>'; break;
                default: el.innerHTML = `<span class="text-yellow-400">● ${state}</span>`;
            }
        }

        function joinGame() {
            const nick = document.getElementById('nickname').value.trim();
            if (!nick) return alert('请输入昵称');
            myNickname = nick;

            const btn = document.getElementById('btn-join');
            btn.disabled = true;
            btn.innerText = '连接中...';

            connectWS(nick);
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'status_update':
                    // 可以用来显示在线人数等状态信息
                    break;

                case 'new_question':
                    showQuestion(data);
                    break;

                case 'answer_received':
                    showView('view-answered');
                    break;

                case 'question_result':
                    showResult(data);
                    break;

                case 'game_finished':
                    showFinished(data);
                    break;
            }
        }

        function showQuestion(data) {
            showView('view-question');

            // 显示进度
            document.getElementById('q-progress').innerText =
                `Question ${data.index + 1} of ${data.total}`;

            // 显示题目文字
            document.getElementById('question-text').innerText = data.question.text;

            // 生成选项按钮（带颜色+字母+文字）
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const options = data.question.options || {};

            for (const [key, val] of Object.entries(options)) {
                const color = OPTION_COLORS[key] || OPTION_COLORS.A;
                const btn = document.createElement('button');
                btn.className = `opt-tap opt-btn ${color.bg} ${color.hover} rounded-2xl p-4 md:p-6 text-left flex items-center gap-4 shadow-lg ${color.ring} ring-2`;
                btn.onclick = () => submitAnswer(key);

                const letterSpan = document.createElement('span');
                letterSpan.className = `flex-shrink-0 w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center text-xl md:text-2xl font-black ${color.dark ? 'text-indigo-900' : 'text-white'} bg-white/30 backdrop-blur`;
                letterSpan.innerText = key;

                const textSpan = document.createElement('span');
                textSpan.className = `text-lg md:text-xl font-semibold ${color.dark ? 'text-indigo-900' : 'text-white'} leading-snug`;
                textSpan.innerText = val;

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);
                container.appendChild(btn);
            }

            // 启动倒计时条
            startTimer(data.timeout || 15);
        }

        function submitAnswer(ans) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'answer', answer: ans }));
            }
        }

        function showResult(data) {
            showView('view-result');
            document.getElementById('result-text').innerText = "查看大屏幕！";
            document.getElementById('result-icon').innerText = "🧐";
        }

        function showFinished(data) {
            showView('view-finished');
            const myScore = data.leaderboard ? data.leaderboard.find(p => p.nickname === myNickname) : null;
            document.getElementById('final-rank').innerHTML = myScore
                ? `<p>你的最终得分: <span class="text-yellow-400 font-bold">${myScore.score}</span></p>`
                : `<p>游戏已结束</p>`;
        }

        function startTimer(seconds) {
            const bar = document.getElementById('timer-bar');
            if (!bar) return;

            // 清除之前的计时器
            if (currentTimeout) clearTimeout(currentTimeout);

            bar.style.transition = 'none';
            bar.style.width = '100%';
            // 强制 reflow
            void bar.offsetHeight;
            bar.style.transition = `width ${seconds}s linear`;
            bar.style.width = '0%';
        }
    </script>
</body>
</html>
